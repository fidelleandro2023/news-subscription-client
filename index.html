<!DOCTYPE html>
<html lang="es" ng-app="newsSubscriptionApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Suscripción de Noticias</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#/">
                <i class="fas fa-newspaper me-2"></i>
                Sistema de Noticias
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#/">
                            <i class="fas fa-home me-1"></i>Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/news">
                            <i class="fas fa-newspaper me-1"></i>Noticias
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#/subscriptions">
                            <i class="fas fa-bell me-1"></i>Suscripciones
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        <!-- Loading Indicator -->
        <div ng-show="loading" class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
        </div>

        <!-- Alert Messages -->
        <div ng-show="alert.show" class="alert" ng-class="'alert-' + alert.type" role="alert">
            <i class="fas" ng-class="alert.icon"></i>
            {{ alert.message }}
            <button type="button" class="btn-close" ng-click="closeAlert()"></button>
        </div>

        <!-- Views will be loaded here -->
        <div ng-view></div>
    </div>

    <!-- Footer -->
    <footer class="bg-light mt-5 py-4">
        <div class="container text-center">
            <p class="mb-0 text-muted">
                &copy; 2025 Sistema de Suscripción de Noticias. Desarrollado con AngularJS y Laravel por Fidel.
            </p>
        </div>
    </footer>

    <!-- AngularJS 1.7 -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-route.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.7.9/angular-resource.min.js"></script>
    
    <!-- jQuery (required for Bootstrap modals) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/app.js"></script>
    <script src="js/services/apiService.js"></script>
    
    <!-- Controllers -->
    <script src="js/controllers/homeController.js"></script>
    <script src="js/controllers/newsController.js"></script>
    <script src="js/controllers/subscriptionController.js"></script>
</body>
</html>
